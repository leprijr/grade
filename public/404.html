<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/grade/?/" />
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
        // Redirect to root with the path preserved as query parameter
        var path = l.pathname.slice(1).replace('/grade/', '');
        if (path && path !== '/') {
          l.replace('/grade/?' + path + l.hash);
        } else {
          l.replace('/grade/');
        }
      }(window.location))
    </script>
  </head>
  <body>
    Redirecionando...
  </body>
</html>
